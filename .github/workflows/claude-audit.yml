name: Claude Audit
on:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 7 * * 1" # weekly full audit
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Audit this booking service. Check for double booking, time zone
            and DST errors, input validation, rate-limit bypass, secret or
            guest data appearing in logs, and Google API failure handling.
            Report only real issues with file, line and a failing scenario.
            On a pull request, comment on it. On a scheduled run, open an
            issue only if you found something.
