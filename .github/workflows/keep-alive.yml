name: Keep Alive
on:
  schedule:
    - cron: "*/20 * * * *" # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check health
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$URL"
